[project]
name = "fraudgt-taia"
version = "0.1.0"
requires-python = "==3.9.*"
dependencies = [
    "torch==2.0.1",
    "torchvision==0.15.2",
    "torchaudio==2.0.2",
    "torch-geometric",
    "torch-sparse",
    "torch-scatter",
    "torchmetrics",
    "yacs",
    "datatable",
    "pandas",
    "dgl",
    "networkx",
    "matplotlib",
    "scikit-learn",
    "scipy",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu118" }]
torchvision = [{ index = "pytorch-cu118" }]
torchaudio = [{ index = "pytorch-cu118" }]
torch-sparse = [{ index = "pyg-cu118" }]
torch-scatter = [{ index = "pyg-cu118" }]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pyg-cu118"
url = "https://data.pyg.org/whl/torch-2.0.0+cu118.html"
explicit = true
